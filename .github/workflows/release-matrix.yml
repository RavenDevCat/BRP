name: Offline release checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r apps/backend/requirements.txt 'pandas<3' pytest httpx python-multipart
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: bash ops/scripts/test_release_matrix.sh
